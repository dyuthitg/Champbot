apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-manager
  namespace: linkedin-automation
  labels:
    app: account-manager
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-manager
  template:
    metadata:
      labels:
        app: account-manager
        component: agent
    spec:
      containers:
      - name: account-manager
        image: linkedin-automation:latest
        args: ["--agents", "account_manager"]
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: LOG_LEVEL
          value: "INFO"
        - name: LINKEDIN_HEADLESS
          value: "true"
        - name: LINKEDIN_BROWSER_TYPE
          value: "playwright"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: data-volume
          mountPath: /app/data
        - name: sessions-volume
          mountPath: /app/sessions
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config-volume
        configMap:
          name: linkedin-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: linkedin-data-pvc
      - name: sessions-volume
        emptyDir: {}
---
